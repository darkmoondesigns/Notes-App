<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meeting Notes Board</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-head">
        <h1>Notes</h1>
        <p>Topic → Meeting → Entry</p>
      </div>

      <section class="block">
        <div class="block-head">
          <h2>Themen</h2>
          <button id="add-topic" class="icon-btn" title="Thema hinzufügen">+</button>
        </div>
        <ul id="topic-list" class="list"></ul>
      </section>

      <section class="block">
        <div class="block-head">
          <h2>Meetings</h2>
          <button id="add-meeting" class="icon-btn" title="Meeting hinzufügen">+</button>
        </div>
        <ul id="meeting-list" class="list"></ul>
      </section>

      <section class="block compact">
        <button id="export-btn" class="secondary">Export JSON</button>
        <label class="secondary file-upload">
          Import JSON
          <input id="import-input" type="file" accept="application/json" />
        </label>
      </section>
    </aside>

    <main class="content">
      <header class="toolbar">
        <div class="context">
          <h2 id="context-title">Kein Thema ausgewählt</h2>
          <p id="context-subtitle">Lege links ein Thema an.</p>
        </div>
        <div class="actions">
          <input id="search-input" type="search" placeholder="Einträge suchen ..." />
          <select id="filter-type">
            <option value="ALL">Alle</option>
            <option value="NOTE">Nur Notizen</option>
            <option value="TODO">Nur Todos</option>
          </select>
          <button id="new-note">Neue Notiz</button>
          <button id="new-todo">Neues Todo</button>
        </div>
      </header>

      <section id="entry-list" class="entry-grid"></section>
    </main>
  </div>

  <dialog id="entry-dialog">
    <form id="entry-form" method="dialog">
      <h3 id="dialog-title">Eintrag</h3>
      <input id="entry-title" type="text" placeholder="Titel" required />
      <textarea id="entry-body" rows="8" placeholder="Notizen ..."></textarea>
      <div class="row">
        <label><input type="checkbox" id="entry-done" /> Todo erledigt</label>
      </div>
      <menu>
        <button type="button" id="cancel-entry" class="secondary">Abbrechen</button>
        <button type="submit">Speichern</button>
      </menu>
    </form>
  </dialog>

  <dialog id="text-dialog">
    <form id="text-form" method="dialog">
      <h3 id="text-title">Name</h3>
      <input id="text-input" type="text" required />
      <input id="text-date" type="date" />
      <menu>
        <button type="button" id="cancel-text" class="secondary">Abbrechen</button>
        <button type="submit">Speichern</button>
      </menu>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
